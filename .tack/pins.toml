# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
# gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
# nixpkgs = "nixpkgs"
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.dcal]
url = "github:duxlabs-dev/dux-calendar"

[inputs.dcal.follows]
nixpkgs = "nixpkgs"

[inputs.dfiles]
url = "github:duxlabs-dev/dux-files"

[inputs.dfiles.follows]
nixpkgs = "nixpkgs"

[inputs.disko]
url = "github:nix-community/disko"

[inputs.disko.follows]
nixpkgs = "nixpkgs"

[inputs.dms]
url = "github:duxlabs-dev/dux-shell/stable"

[inputs.dms.follows]
nixpkgs = "nixpkgs"

[inputs.dms-plugin]
url = "github:AvengeMedia/dms-plugin-registry"

[inputs.dms-plugin.follows]
nixpkgs = "nixpkgs"

[inputs.home-manager]
url = "github:nix-community/home-manager"

[inputs.home-manager.follows]
nixpkgs = "nixpkgs"

[inputs.niri-snap]
url = "github:adienox/niri-snap"

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"

[inputs.nix-index-database.follows]
nixpkgs = "nixpkgs"

[inputs.nixos-hardware]
url = "github:NixOS/nixos-hardware/master"

[inputs.nixos-hardware.follows]
nixpkgs = "nixpkgs"

[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"

[inputs.quadlet-nix]
url = "github:SEIAROTg/quadlet-nix"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"

[inputs.sops-nix.follows]
nixpkgs = "nixpkgs"

[inputs.spicetify-nix]
url = "github:Gerg-L/spicetify-nix"

[inputs.vicinae]
url = "github:vicinaehq/vicinae"

[inputs.vicinae-extensions]
url = "github:vicinaehq/extensions"

[inputs.vicinae-extensions.follows]
nixpkgs = "nixpkgs"

[inputs.xremap]
url = "github:xremap/nix-flake"

[inputs.xremap.follows]
nixpkgs = "nixpkgs"
